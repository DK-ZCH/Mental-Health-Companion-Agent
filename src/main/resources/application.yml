# Tomcat
server:
    tomcat:
        uri-encoding: UTF-8
    port: 8080
    servlet:
        context-path: /xinlijiankangxitong

spring:
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://127.0.0.1:3306/mental_health_companion_agent?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8
        username: root
        password: 123456

    servlet:
      multipart:
        max-file-size: 1000MB
        max-request-size: 1000MB

    # Spring Boot 3：静态资源位置由 spring.resources 迁移到 spring.web.resources
    web:
      resources:
        static-locations: classpath:static/,file:static/

# ===== MyBatis-Plus（3.5.x 配置结构，与 2.x 有破坏性差异）=====
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  # 实体扫描，多个 package 用逗号或分号分隔
  type-aliases-package: com.entity
  global-config:
    banner: false
    db-config:
      # 主键类型：auto / input / assign_id / assign_uuid
      # （对应 2.x 的 id-type: 1「用户输入ID」）
      id-type: input
      # 字段策略：2.x 的 field-strategy: 2 已拆分为 insert/update/where 三项
      insert-strategy: not_null
      update-strategy: not_null
      # 驼峰下划线转换（2.x 的 db-column-underline）
      table-underline: true
      # 逻辑删除配置
      # 注：当前 16 个实体均未使用 @TableLogic，故逻辑删除实际不生效（与 2.x 行为一致，保持现状）
      logic-delete-value: -1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    # 需要 jdbcTypeForNull 配置（Oracle 需设为 JdbcType.NULL，默认 Other）
    jdbc-type-for-null: 'null'

# 打印 SQL 语句
logging:
  level:
    com.dao: debug
