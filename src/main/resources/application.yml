# Tomcat
server:
    tomcat:
        uri-encoding: UTF-8
    port: 8080
    servlet:
        context-path: /xinlijiankangxitong

spring:
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://127.0.0.1:3306/mental_health_companion_agent?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8
        username: root
        password: 123456

    # ===== Spring AI / DeepSeek（Phase 4 / Step 11 Preflight）=====
    # 注意：Spring AI 只认 spring.ai.deepseek.api-key，
    #       **不会**自动读取 DEEPSEEK_API_KEY 环境变量 ⇒ 必须显式映射。
    # 缺失时上下文启动失败（fail-fast），不静默降级、不假装可用。
    ai:
        deepseek:
            api-key: ${DEEPSEEK_API_KEY:}
            chat:
                options:
                    model: deepseek-chat
                    temperature: 0.3
        # Tool 异常必须向上抛出，不得被转换成「正常 ToolResult」回喂模型。
        # Step 11 依赖此项让「身份上下文非法」终止 Agent 调用（AgentController → code=500）。
        # ⚠️ 这是 Step 11 单 Tool 阶段的最小实现，不是全局异常治理的最终契约。
        tools:
            throw-exception-on-error: true

    servlet:
      multipart:
        max-file-size: 1000MB
        max-request-size: 1000MB

    # Spring Boot 3：静态资源位置由 spring.resources 迁移到 spring.web.resources
    web:
      resources:
        static-locations: classpath:static/,file:static/

# ===== MyBatis-Plus（3.5.x 配置结构，与 2.x 有破坏性差异）=====
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  # 实体扫描，多个 package 用逗号或分号分隔
  type-aliases-package: com.entity
  global-config:
    banner: false
    db-config:
      # 主键类型：auto / input / assign_id / assign_uuid
      # （对应 2.x 的 id-type: 1「用户输入ID」）
      id-type: input
      # 字段策略：2.x 的 field-strategy: 2 已拆分为 insert/update/where 三项
      insert-strategy: not_null
      update-strategy: not_null
      # 驼峰下划线转换（2.x 的 db-column-underline）
      table-underline: true
      # 逻辑删除配置
      # 注：当前 16 个实体均未使用 @TableLogic，故逻辑删除实际不生效（与 2.x 行为一致，保持现状）
      logic-delete-value: -1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    # 需要 jdbcTypeForNull 配置（Oracle 需设为 JdbcType.NULL，默认 Other）
    jdbc-type-for-null: 'null'

# 打印 SQL 语句
# ⚠️ com.dao: debug 会把所有 mapper 的 SQL 参数打进日志（含会话内容等敏感数据）。
#    Agent 会话的两个新 mapper 刻意降级为 warn（T12 隐私断言）；
#    其余既有 mapper 的 DEBUG 参数日志属既有行为，登记为 DEBT-MAPPER-SQL-PARAM-LOGS。
logging:
  level:
    com.dao: debug
    com.dao.AgentConversationDao: warn
    com.dao.AgentMessageDao: warn
    # P0-AUTH-TOKEN-LOG：AuthTokenDao 含 token 字段（登录令牌）——DEBUG 参数行会以明文
    # 输出真实登录令牌（Q1 实锤），降为 warn 阻断会话劫持面（Q3 已验证有效）。
    com.dao.AuthTokenDao: warn
    # P1 敏感 DAO 日志治理（2026-11-04）：以下 9 个 DAO 的写参数含用户内容/答案/凭据/PII，
    # 降为 warn；公开语料/公告/字典/配置/试卷名/收藏 6 个维持 debug（保留调试能力，非全局关闭）。
    com.dao.CounselorMessageDao: warn
    com.dao.AssessmentAnswerDao: warn
    com.dao.AssessmentWrongQuestionDao: warn
    com.dao.AssessmentQuestionDao: warn
    com.dao.AdminUserDao: warn
    com.dao.CounselorDao: warn
    com.dao.StudentDao: warn
    com.dao.AssessmentRecordDao: warn
    com.dao.CounselingAppointmentDao: warn
